<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentSmith Lite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">AgentSmith Lite</p>
          <h1>Operations Console</h1>
        </div>
        <div id="health" class="health">Checking</div>
      </section>
      <p id="status-message" class="status-message hidden"></p>

      <section id="login" class="panel">
        <h2 id="login-title">Sign in</h2>
        <form id="login-form">
          <label>
            Email
            <input name="email" autocomplete="username" value="admin@agentsmith-lite.local" />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" value="admin-password" />
          </label>
          <button type="submit">Sign in</button>
        </form>
      </section>

      <section id="dashboard" class="dashboard hidden">
        <div class="panel dashboard-session">
          <div>
            <h2>Dashboard</h2>
            <p class="metric">Product workspace session</p>
          </div>
          <button id="logout-button" class="secondary-button" type="button">Sign out</button>
        </div>
        <div class="panel">
          <div class="section-title">
            <h2>Workspaces</h2>
          </div>
          <form id="workspace-project-form" class="stacked-form workspace-project-form">
            <div class="form-grid">
              <label>
                Workspace name
                <input name="workspaceName" required />
              </label>
              <label>
                Project name
                <input name="projectName" required />
              </label>
            </div>
            <button type="submit">Create workspace/project</button>
          </form>
          <p id="current-project" class="metric">No project</p>
          <div id="workspaces" class="list"></div>
        </div>
        <div class="panel">
          <div class="section-title">
            <h2>Endpoints</h2>
            <p id="endpoints-count" class="metric">0 endpoints</p>
          </div>
          <form id="endpoint-form" class="stacked-form">
            <div class="form-grid">
              <label>
                Name
                <input name="name" required />
              </label>
              <label>
                Model
                <input name="model" required />
              </label>
            </div>
            <label>
              Base URL
              <input name="baseUrl" type="url" required />
            </label>
            <div class="form-grid">
              <label>
                Secret ref
                <input name="secretRef" autocomplete="off" required />
              </label>
              <label>
                Timeout seconds
                <input name="requestTimeoutSecs" type="number" min="1" value="30" required />
              </label>
            </div>
            <button type="submit">Create endpoint</button>
          </form>
          <div id="endpoints" class="list"></div>
        </div>
        <div class="panel">
          <h2>Chat</h2>
          <form id="chat-form" class="stacked-form">
            <label>
              Endpoint
              <select id="chat-endpoint" name="endpointId"></select>
            </label>
            <label>
              Message
              <textarea name="message" rows="4" required></textarea>
            </label>
            <button type="submit">Send</button>
          </form>
          <div id="chat-reply" class="reply hidden"></div>
        </div>
        <div class="panel">
          <h2>Tasks</h2>
          <form id="task-form" class="stacked-form">
            <label>
              Endpoint
              <select id="task-endpoint" name="endpointId"></select>
            </label>
            <label>
              Prompt
              <textarea name="prompt" rows="4" required></textarea>
            </label>
            <button type="submit">Create task</button>
          </form>
          <p id="tasks-count" class="metric">0 tasks</p>
          <div id="tasks" class="list"></div>
        </div>
        <div class="panel">
          <h2>Task Timeline</h2>
          <p id="timeline-count" class="metric">0 events</p>
          <div id="timeline" class="list"></div>
        </div>
        <div class="panel">
          <h2>Artifacts</h2>
          <p id="artifacts-count" class="metric">0 files</p>
          <div id="artifacts" class="list"></div>
        </div>
        <div class="panel">
          <h2>Project Files</h2>
          <form id="project-file-form" class="stacked-form">
            <label>
              Path
              <input name="path" placeholder="files/readme.md" required />
            </label>
            <label>
              Content
              <textarea name="content" rows="4" required></textarea>
            </label>
            <button type="submit">Upload file</button>
          </form>
          <p id="files-count" class="metric">0 entries</p>
          <div id="files" class="list"></div>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
