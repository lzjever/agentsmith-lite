[package]
name = "agentsmith-bash-executor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "bash-executor"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
